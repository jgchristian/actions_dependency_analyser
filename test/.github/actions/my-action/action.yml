name: 'My Local Action'
description: 'A sample local composite action'
inputs:
  example-input:
    description: 'An example input'
    required: false
    default: 'hello'
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
    
    - name: Setup Node
      uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
      with:
        node-version: '20'
    
    - name: Run script
      shell: bash
      run: echo "Running with input ${{ inputs.example-input }}"
